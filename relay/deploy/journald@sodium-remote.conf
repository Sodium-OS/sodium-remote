# Journal namespace "sodium-remote": coturn's session logs (sodium-remote-coturn.service
# has LogNamespace=sodium-remote), kept apart from the system journal. Installed by
# server-setup.sh as /etc/systemd/journald@sodium-remote.conf; the main journald.conf
# is never touched. Read with: journalctl --namespace=sodium-remote -u sodium-remote-coturn
[Journal]
Storage=persistent
MaxRetentionSec=7day
SystemMaxUse=200M
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no
