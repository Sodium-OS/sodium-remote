[package]
name = "remote-e2e"
edition = "2024"
version = "0.1.0"
publish = false
description = "Remote end-to-end harness: the click test surface and a virtual input tool for nested Hyprland (the host is the real remoted)"

# Standalone: the harness is not a member of remote/'s workspace.
[workspace]

[[bin]]
name = "test-surface"
path = "src/bin/test-surface.rs"

[[bin]]
name = "vinput"
path = "src/bin/vinput.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
