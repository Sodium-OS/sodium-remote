[package]
name = "host-desktop"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Sodium Remote's portable host: session and media glue on remote-core's connect::Host, with a backend per OS (Windows, macOS, generic Linux through the desktop portal)"

# Build needs: FFmpeg (libavcodec, libavutil, libswscale), OpenH264 and Opus headers and
# libraries. Linux: the system's (pacman -S ffmpeg openh264 opus). Windows
# (x86_64-pc-windows-gnu): remote/packaging/windows/build-deps.sh, then `. env.sh`.

[lib]
path = "src/lib.rs"

[[bin]]
name = "sodium-remote-host"
path = "src/main.rs"

[dependencies]
remote-core = { path = "../core" }
anyhow = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "macros", "sync", "signal"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
png = "0.17"
serde_json = "1"
sha2 = "0.10"
uniffi = { version = "0.32", optional = true }

[features]
default = ["linux-portal"]
# The generic Linux host (docs/reference/host-linux.md): xdg-desktop-portal RemoteDesktop and
# ScreenCast over PipeWire, libei, the portal clipboard, the default sink's monitor,
# VA-API/NVENC/software encoders. Linux only; elsewhere it does nothing.
linux-portal = ["dep:ashpd", "dep:reis", "dep:xkbcommon", "dep:remote-linux-media", "dep:futures-util", "dep:rustix", "dep:zbus"]
# The UniFFI surface for Remote.app's "This computer" pane (src/ffi.rs). Turns on
# remote-core's too: one static library and one Swift module for both (build-swift.sh).
ffi = ["dep:uniffi", "remote-core/ffi"]

# The generic Linux host (feature linux-portal).
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", optional = true, default-features = false, features = ["tokio", "remote_desktop", "screencast", "clipboard"] }
reis = { version = "0.7", optional = true }
xkbcommon = { version = "0.9", optional = true }
futures-util = { version = "0.3", optional = true }
# logind's LockedHint on the system bus (the same zbus ashpd uses).
zbus = { version = "6", optional = true, default-features = false, features = ["tokio"] }
rustix = { version = "1", optional = true, features = ["event", "time", "fs", "process"] }
remote-linux-media = { path = "../linux-media", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Devices_Display",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Networking_WinHttp",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Security",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS: pure Rust on the objc2 framework crates,
# no Objective-C or Swift sources. ScreenCaptureKit, VideoToolbox, CoreGraphics events,
# AppKit (NSPasteboard, NSWorkspace, NSCursor, NSScreen), IOKit power assertions.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-video = "0.3"
objc2-video-toolbox = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-io-surface = "0.3"
objc2-app-kit = "0.3"
objc2-io-kit = { version = "0.3", default-features = false, features = ["std", "pwr_mgt"] }

[build-dependencies]
cc = "1"
