[package]
name = "remote-core"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Remote's protocol core: ICE path, Noise IK, framing, FEC, pacing, congestion control"

[dependencies]
# ICE: str0m's standalone sans-IO agent (full RFC 8445, renominating). See docs/reference/protocol.md, "ICE choice".
is = "0.12"
turn-client-proto = "0.7"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
# Session crypto: Noise IK, then per-packet ChaCha20-Poly1305 with explicit nonces.
snow = "0.10"
# Per-frame forward error correction.
reed-solomon-simd = "3.1"
rand = "0.9"
tracing = "0.1"
# The thin driver.
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync", "io-util"] }
socket2 = "0.6"
# Local addresses, re-read to re-gather candidates on a network change.
if-addrs = "0.13"
# Message schemas (msg.rs): serde with a compact binary encoding.
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
# Device keys (Ed25519, PKCS#8 PEM: the host key file contract) and pairing.
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "std"] }
spake2 = "0.4"
hmac = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
base64 = "0.22"
# The rendezvous client: WSS with Web PKI (the platform's roots) or a pinned CA.
serde_json = "1"
rustls-native-certs = "0.8"
# server.toml and networks.toml.
toml = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# LAN discovery.
mdns-sd = "0.21"
# Swift bindings for the Mac client (the `ffi` module), off by default.
uniffi = { version = "0.32", optional = true }

[features]
# The UniFFI surface for Swift (src/ffi.rs). `uniffi-bindgen` generates the bindings.
ffi = ["dep:uniffi", "tokio/rt-multi-thread"]
uniffi-cli = ["ffi", "uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }

# DPAPI for the Windows device key (keyprotect.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
